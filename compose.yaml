services:
  vision:
    build: ./vision
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transit
      POSTGRES_USER: transit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - transit_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit -d transit"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/transit
      DATABASE_USER: transit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      OPERATOR_KEY: ${OPERATOR_KEY:?Set OPERATOR_KEY in .env}
      DEMO_ACCESS_ENABLED: ${DEMO_ACCESS_ENABLED:-true}
      VISION_URL: http://vision:8001
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  transit_data:
